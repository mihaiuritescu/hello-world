# Local stack: MySQL, a one-off migration, then the app on http://localhost:3000.
# Only Docker is needed: `docker compose up --build`.
name: hello-world

# Shared by `migrate` and `app`: the same image, built once (BuildKit reuses the layers).
x-app: &app
  build: .
  environment:
    DB_HOST: db
    DB_PORT: '3306'
    DB_USER: hello_world
    DB_PASSWORD: hello_world
    DB_NAME: hello_world
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hello_world
      MYSQL_USER: hello_world
      MYSQL_PASSWORD: hello_world
    ports:
      # 3307 on the host, so a locally installed MySQL on 3306 doesn't clash.
      - '${DB_PORT:-3307}:3306'
    volumes:
      - db-data:/var/lib/mysql
      # Creates the test databases on the first start.
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: on first start MySQL runs a temporary server without networking,
      # and only the real server answers on 127.0.0.1.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
      start_interval: 1s

  migrate:
    <<: *app
    command: ['node', 'src/server/migrate.ts']
    restart: 'no'

  app:
    <<: *app
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/readyz']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  db-data:
